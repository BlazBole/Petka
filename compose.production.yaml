services:
  app:
    # Aplikacija je dostopna lokalno na VPS in Caddyju v Docker omrežju.
    environment:
      GAME_SECRET: ${GAME_SECRET:?Nastavi GAME_SECRET}
  caddy:
    profiles: ["app"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Nastavi DOMAIN v .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
